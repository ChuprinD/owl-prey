model_path: models/best.pt
output_dir: runs/demo

input:
  # local or azure_blob
  source: local

  blob_name: "Meddo/ch2/Meddo_ch2_main_20250406151817_20250406151953.mp4"

  # For local:
  video_path: data/videos/demo1.mp4

  download_dir: data/videos/downloaded
  overwrite_download: false

frame_stride: 1
sample_fps: null

inference:
  conf: 0.15
  iou: 0.6
  imgsz: 640
  max_det: 2
  device: null
  augment: false
  batch_size: 128

postprocess:
  min_conf_by_group:
    owl: 0.25
    prey: 0.16

class_groups:
  owl:
    - steenuil
  prey: 
    - boismuis
    - larve
    - loopkever
    - meikever
    - nachtvlinder
    - regenworm
    - spin
    - spitsmuis
    - sprinkhaan
    - veldmuis
    - vogel_prooi


required_groups:
  - owl
  - prey

# Positive integer for best N frames, or all for every frame after postprocessing.
top_k: 5
min_gap_seconds: 0.1

audio:
  # Set to true to run the audio-guided pipeline. Set to false to use the
  # normal frame-scanning pipeline.
  enabled: false
  threshold_db: -20.0
  padding_seconds: 2.0
  min_event_seconds: 0.2
