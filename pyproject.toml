[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "owl-prey-detection"
version = "0.1.0"
description = "Owl prey detection project"
requires-python = ">=3.10"

dependencies = [
    "azure-storage-blob",
    "pandas",
    "python-dotenv",
    "pyyaml",
    "opencv-python-headless",
    "numpy",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
owl-inventory = "owl_prey_detection.cli.stage1_inventory:main"
owl-sample = "owl_prey_detection.cli.stage2_sample:main"
owl-extract = "owl_prey_detection.cli.stage3_extract:main"