[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owl-prey-detection"
version = "0.1.0"
description = "Pipeline for detecting owl-with-prey moments in nest-box videos."
requires-python = ">=3.11"

[project.scripts]
owl-prey-detection = "owl_prey_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
